name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: 'graalvm-community'
        java-version: '25'
        components: 'native-image'
    - name: build
      run: mvn -Pnative native:compile
    - name: run app
      run: ./target/spring-jpa-native-cce